<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');

:root{
  --midnight:#12142b;
  --velvet:#1d2148;
  --velvet-2:#262b5c;
  --gold:#d8b37b;
  --gold-dim:#8f7b56;
  --ember:#c97b84;
  --parchment:#f4eee3;
  --silver:#9296b4;
  --stamp:#ff8a3d;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:radial-gradient(120% 140% at 50% -10%, var(--velvet) 0%, var(--midnight) 55%, #0b0c1e 100%);
  color:var(--parchment);
  font-family:'Jost', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(244,238,227,.35) 0, transparent 60%),
    radial-gradient(1px 1px at 80% 15%, rgba(244,238,227,.25) 0, transparent 60%),
    radial-gradient(1.5px 1.5px at 60% 65%, rgba(244,238,227,.3) 0, transparent 60%),
    radial-gradient(1px 1px at 30% 80%, rgba(244,238,227,.2) 0, transparent 60%),
    radial-gradient(1px 1px at 90% 75%, rgba(244,238,227,.3) 0, transparent 60%),
    radial-gradient(1.5px 1.5px at 45% 35%, rgba(244,238,227,.2) 0, transparent 60%);
  z-index:0;
}

.topnav{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  gap:2.5rem;
  padding:2rem 1rem 0;
}
.nav-link{
  font-family:'Space Mono', monospace;
  font-size:.72rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--silver);
  text-decoration:none;
  background:none;
  border:none;
  padding-bottom:.4rem;
  border-bottom:1px solid transparent;
  transition:color .3s var(--ease), border-color .3s var(--ease);
}
.nav-link:hover{color:var(--parchment);}
.nav-link.active{color:var(--gold);border-color:var(--gold);}

.eyebrow{
  font-family:'Space Mono', monospace;
  font-size:.72rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--silver);
  margin:0 0 .6rem;
}

button{font-family:inherit;cursor:pointer;}

.view{display:none;}
.view.active{display:block;}

[hidden]{display:none !important;}

/* ---------- SONG VIEW ---------- */

.song-stage{
  position:relative;
  z-index:1;
  min-height:calc(100vh - 90px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2rem 1.5rem 1rem;
}

.song-title{
  font-family:'Cormorant Garamond', serif;
  font-weight:500;
  font-style:italic;
  font-size:clamp(1.6rem, 4vw, 2.6rem);
  color:var(--parchment);
  margin:0 0 2.6rem;
  max-width:22ch;
}

.player{
  position:relative;
  width:min(46vw, 300px);
  height:min(46vw, 300px);
  margin-bottom:2.6rem;
}

.vinyl{
  width:100%;
  height:100%;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle at center,
      #0d0e20 0, #0d0e20 2px,
      #191b38 3px, #191b38 4px);
  box-shadow:0 25px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(216,179,123,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .6s var(--ease);
}
.vinyl.spinning{animation:spin 5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.vinyl-label{
  width:36%;
  height:36%;
  border-radius:50%;
  background:linear-gradient(155deg, var(--ember), var(--gold-dim));
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:1.1rem;
  color:var(--midnight);
  box-shadow:0 0 0 6px rgba(18,20,43,.6);
}

.tonearm{
  position:absolute;
  top:-8%;
  right:-6%;
  width:46%;
  height:46%;
  transform-origin:88% 12%;
  transform:rotate(-28deg);
  transition:transform .6s var(--ease);
  pointer-events:none;
}
.tonearm.playing{transform:rotate(0deg);}
.tonearm::before{
  content:'';
  position:absolute;
  top:8%;
  right:6%;
  width:4px;
  height:78%;
  background:linear-gradient(var(--gold), var(--gold-dim));
  border-radius:3px;
  box-shadow:0 0 8px rgba(216,179,123,.4);
}
.tonearm::after{
  content:'';
  position:absolute;
  top:4%;
  right:2%;
  width:16px;height:16px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px rgba(216,179,123,.6);
}

.controls{display:flex;flex-direction:column;align-items:center;gap:1.1rem;min-height:64px;}

.playback{display:flex;align-items:center;gap:1rem;}

.play-btn{
  width:44px;height:44px;
  border-radius:50%;
  border:1px solid var(--gold-dim);
  background:transparent;
  color:var(--gold);
  font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:background .3s var(--ease), transform .2s var(--ease);
}
.play-btn:hover{background:rgba(216,179,123,.12);}
.play-btn:active{transform:scale(.94);}

.eq{display:flex;align-items:flex-end;gap:3px;height:22px;}
.eq span{
  width:3px;
  background:var(--ember);
  border-radius:2px;
  height:6px;
}
.eq.live span{animation:eq 1s ease-in-out infinite;}
.eq.live span:nth-child(2){animation-delay:.15s;}
.eq.live span:nth-child(3){animation-delay:.3s;}
.eq.live span:nth-child(4){animation-delay:.45s;}
@keyframes eq{
  0%,100%{height:6px;}
  50%{height:22px;}
}

.seek{
  -webkit-appearance:none;
  width:140px;height:2px;
  background:var(--velvet-2);
  border-radius:2px;
  outline:none;
}
.seek::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:10px;height:10px;border-radius:50%;
  background:var(--gold);cursor:pointer;
}
.seek::-moz-range-thumb{
  width:10px;height:10px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
}

.time{font-family:'Space Mono', monospace;font-size:.7rem;color:var(--silver);}

.hint{
  position:relative;z-index:1;
  text-align:center;
  font-family:'Space Mono', monospace;
  font-size:.68rem;
  letter-spacing:.1em;
  color:var(--silver);
  opacity:.6;
  padding-bottom:2rem;
}

/* ---------- GALLERY VIEW ---------- */

.lock-stage{
  position:relative;z-index:1;
  min-height:calc(100vh - 90px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:2rem;
  transition:opacity .5s var(--ease), filter .5s var(--ease);
}
.lock-stage.leaving{opacity:0;filter:blur(6px);}

.lock-title{
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(1.6rem,4vw,2.4rem);
  margin:0 0 2rem;
}

.code-boxes{display:flex;gap:.9rem;}
.code-box{
  width:52px;height:64px;
  text-align:center;
  font-family:'Space Mono', monospace;
  font-size:1.6rem;
  color:var(--gold);
  background:rgba(244,238,227,.03);
  border:1px solid var(--velvet-2);
  border-radius:8px;
  outline:none;
  transition:border-color .25s var(--ease), transform .25s var(--ease);
  caret-color:var(--gold);
}
.code-box:focus{border-color:var(--gold);}
.code-boxes.shake{animation:shake .4s var(--ease);}
.code-boxes.shake .code-box{border-color:var(--ember);}
@keyframes shake{
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
  100%{transform:translateX(0);}
}

.lock-error{
  font-family:'Space Mono', monospace;
  font-size:.72rem;
  letter-spacing:.06em;
  color:var(--ember);
  margin-top:1.2rem;
  opacity:0;
  transition:opacity .3s var(--ease);
}
.lock-error.show{opacity:1;}

.gallery-stage{
  position:relative;z-index:1;
  min-height:calc(100vh - 90px);
  display:flex;align-items:center;justify-content:center;
  padding:2rem;
  animation:rise .7s var(--ease);
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

.slideshow{
  position:relative;
  width:min(80vw, 720px);
  height:min(70vh, 620px);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.8);
}

.slides{position:relative;width:100%;height:100%;background:#000;}
.slide{
  position:absolute;inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity 1.1s var(--ease);
}
.slide.active{opacity:1;z-index:1;}
.slide img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  transform:scale(1.03);
  animation:settle 9s var(--ease) forwards;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
}
@keyframes settle{
  from{transform:scale(1.03);}
  to{transform:scale(1);}
}
@media (prefers-reduced-motion: reduce){
  .slide img{animation:none;transform:none;}
  .vinyl.spinning{animation:none;}
}

.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(244,238,227,.3);
  background:rgba(18,20,43,.35);
  backdrop-filter:blur(4px);
  color:var(--parchment);
  font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity .3s var(--ease), background .3s var(--ease);
  z-index:2;
}
.slideshow:hover .nav-arrow{opacity:1;}
.nav-arrow:hover{background:rgba(18,20,43,.7);}
.nav-arrow.prev{left:14px;}
.nav-arrow.next{right:14px;}

.stamp{
  position:absolute;bottom:16px;right:18px;
  font-family:'Space Mono', monospace;
  font-size:.75rem;
  letter-spacing:.05em;
  color:var(--stamp);
  text-shadow:0 0 6px rgba(255,138,61,.5);
  z-index:2;
}

.sprockets{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;justify-content:center;gap:6px;
  padding:10px 0;
  z-index:2;
}
.sprocket{
  width:14px;height:4px;
  border-radius:2px;
  background:rgba(244,238,227,.25);
  transition:background .3s var(--ease), width .3s var(--ease);
}
.sprocket.active{background:var(--gold);width:24px;}

.missing-note{
  font-family:'Space Mono', monospace;
  font-size:.75rem;
  color:var(--ember);
  text-align:center;
  max-width:34ch;
  line-height:1.6;
}

.toast{
  position:absolute;
  bottom:50px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(18,20,43,.9);
  border:1px solid var(--gold-dim);
  color:var(--parchment);
  padding:.6rem 1.2rem;
  border-radius:8px;
  font-family:'Space Mono', monospace;
  font-size:.7rem;
  letter-spacing:.04em;
  text-align:center;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s var(--ease), transform .35s var(--ease);
  z-index:3;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

@media (max-width:560px){
  .topnav{gap:1.6rem;}
  .code-box{width:44px;height:56px;font-size:1.3rem;}
  .slideshow{width:92vw;height:60vh;}
}
</style>
</head>
<body>

<!--
============================================================
  EDIT THESE THREE THINGS TO ADD YOUR OWN SONG + PHOTOS
============================================================
  1. Put this HTML file in a folder.
  2. Put your song file in the SAME folder (e.g. song.mp3).
  3. Make a folder called "images" next to this file, and
     put your photos in it (e.g. images/1.jpg, images/2.jpg...).
  4. Scroll down to the <script> near the bottom and edit the
     SONG_SRC, SONG_TITLE, and IMAGE_FILES values to match
     your actual filenames.
============================================================
-->

<nav class="topnav">
  <button class="nav-link active" id="navSong">the song</button>
  <button class="nav-link" id="navGallery">the gallery</button>
</nav>

<!-- ---------- SONG VIEW ---------- -->
<section class="view active" id="songView">
  <main class="song-stage">
    <p class="eyebrow">a little something for you</p>
    <h1 class="song-title" id="trackTitle">our song</h1>

    <div class="player" id="player">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label"><span>♪</span></div>
      </div>
      <div class="tonearm" id="tonearm"></div>
    </div>

    <div class="controls">
      <div class="playback" id="playback">
        <button class="play-btn" id="playBtn" aria-label="play">▶</button>
        <div class="eq" id="eq"><span></span><span></span><span></span><span></span></div>
        <input type="range" class="seek" id="seek" value="0" min="0" max="100" step="0.1">
        <span class="time" id="timeLabel">0:00 / 0:00</span>
      </div>
    </div>

    <audio id="audio" preload="metadata"></audio>
  </main>
  <p class="hint" id="songHint">tap the record to play</p>
</section>

<!-- ---------- GALLERY VIEW ---------- -->
<section class="view" id="galleryView">
  <main class="lock-stage" id="lockStage">
    <p class="eyebrow">a memory, locked away</p>
    <h1 class="lock-title">enter the code</h1>
    <div class="code-boxes" id="codeBoxes">
      <input maxlength="1" inputmode="numeric" class="code-box" data-i="0">
      <input maxlength="1" inputmode="numeric" class="code-box" data-i="1">
      <input maxlength="1" inputmode="numeric" class="code-box" data-i="2">
      <input maxlength="1" inputmode="numeric" class="code-box" data-i="3">
    </div>
    <p class="lock-error" id="lockError">that's not quite it — try again</p>
  </main>

  <main class="gallery-stage" id="galleryStage" hidden>
    <div class="slideshow" id="slideshow">
      <div class="slides" id="slides"></div>
      <button class="nav-arrow prev" id="prevBtn" aria-label="previous">‹</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="next">›</button>
      <div class="stamp" id="stamp"></div>
      <div class="sprockets" id="sprockets"></div>
      <div class="toast" id="toast">please close the tab after you're done</div>
    </div>
  </main>
</section>

<script>
/* ============================================================
   EDIT HERE — your song, its title, and your photo filenames
   ============================================================ */
const SONG_SRC   = "song.mp3";              // your song file, next to this HTML file
const SONG_TITLE = "our song";              // shows above the record

const IMAGE_FILES = [                       // your photos, in the "images" folder
  "images/1.jpg",
  "images/2.jpg",
  "images/3.jpg",
  "images/4.jpg",
  "images/5.jpg",
  "images/6.jpg"
  // add or remove lines as needed
];

const CODE = "1801";                        // the gallery password
/* ============================================================ */

/* ---------- view switching ---------- */
const navSong = document.getElementById('navSong');
const navGallery = document.getElementById('navGallery');
const songView = document.getElementById('songView');
const galleryView = document.getElementById('galleryView');
const audioEl = document.getElementById('audio');

function showView(name){
  const toSong = name === 'song';
  songView.classList.toggle('active', toSong);
  galleryView.classList.toggle('active', !toSong);
  navSong.classList.toggle('active', toSong);
  navGallery.classList.toggle('active', !toSong);
  if(!toSong) audioEl.pause();
  else resetGalleryLock();
}
navSong.addEventListener('click', () => showView('song'));
navGallery.addEventListener('click', () => showView('gallery'));

/* ---------- SONG PLAYER ---------- */
const vinyl = document.getElementById('vinyl');
const tonearm = document.getElementById('tonearm');
const trackTitle = document.getElementById('trackTitle');
const playBtn = document.getElementById('playBtn');
const eq = document.getElementById('eq');
const seek = document.getElementById('seek');
const timeLabel = document.getElementById('timeLabel');
const songHint = document.getElementById('songHint');

trackTitle.textContent = SONG_TITLE;
audioEl.src = SONG_SRC;
audioEl.addEventListener('error', () => {
  songHint.textContent = `couldn't find "${SONG_SRC}" — make sure it's in the same folder as this file`;
});

function fmt(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function setPlayingState(isPlaying){
  vinyl.classList.toggle('spinning', isPlaying);
  tonearm.classList.toggle('playing', isPlaying);
  eq.classList.toggle('live', isPlaying);
  playBtn.textContent = isPlaying ? '❚❚' : '▶';
}
function togglePlay(){
  audioEl.paused ? audioEl.play() : audioEl.pause();
}
vinyl.addEventListener('click', togglePlay);
playBtn.addEventListener('click', togglePlay);
audioEl.addEventListener('play', () => setPlayingState(true));
audioEl.addEventListener('pause', () => setPlayingState(false));
audioEl.addEventListener('ended', () => setPlayingState(false));
audioEl.addEventListener('timeupdate', () => {
  if(audioEl.duration) seek.value = (audioEl.currentTime / audioEl.duration) * 100;
  timeLabel.textContent = `${fmt(audioEl.currentTime)} / ${fmt(audioEl.duration)}`;
});
seek.addEventListener('input', () => {
  if(audioEl.duration) audioEl.currentTime = (seek.value/100) * audioEl.duration;
});

/* ---------- PASSWORD LOCK ---------- */
const lockStage = document.getElementById('lockStage');
const galleryStage = document.getElementById('galleryStage');
const boxesWrap = document.getElementById('codeBoxes');
const boxes = Array.from(document.querySelectorAll('.code-box'));
const lockError = document.getElementById('lockError');

function resetGalleryLock(){
  clearInterval(timer);
  clearTimeout(inactivityTimer);
  lockStage.hidden = false;
  lockStage.classList.remove('leaving');
  galleryStage.hidden = true;
  lockError.classList.remove('show');
  boxes.forEach(b => b.value = '');
  boxes[0].focus();
}

/* auto re-lock after 30s of no activity while the gallery is open */
let inactivityTimer = null;
function armInactivityTimer(){
  clearTimeout(inactivityTimer);
  if(!galleryStage.hidden){
    inactivityTimer = setTimeout(resetGalleryLock, 30000);
  }
}
['mousemove','mousedown','keydown','touchstart','click','wheel'].forEach(evt => {
  document.addEventListener(evt, () => armInactivityTimer(), { passive: true });
});

function checkCode(){
  const entered = boxes.map(b => b.value).join('');
  if(entered.length < 4) return;
  if(entered === CODE){
    lockStage.classList.add('leaving');
    setTimeout(() => {
      lockStage.hidden = true;
      galleryStage.hidden = false;
      buildSlideshow();
      armInactivityTimer();
    }, 480);
  } else {
    lockError.classList.add('show');
    boxesWrap.classList.add('shake');
    setTimeout(() => {
      boxesWrap.classList.remove('shake');
      boxes.forEach(b => b.value = '');
      boxes[0].focus();
    }, 420);
  }
}
boxes.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/[^0-9]/g,'');
    if(box.value && i < boxes.length - 1) boxes[i+1].focus();
    lockError.classList.remove('show');
    if(i === boxes.length - 1) checkCode();
  });
  box.addEventListener('keydown', e => {
    if(e.key === 'Backspace' && !box.value && i > 0) boxes[i-1].focus();
  });
});

/* ---------- SLIDESHOW ---------- */
const slideshow = document.getElementById('slideshow');
const slidesEl = document.getElementById('slides');
const sprocketsEl = document.getElementById('sprockets');
const stampEl = document.getElementById('stamp');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const toast = document.getElementById('toast');
let toastTimer = null;

function flashToast(){
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

let current = 0;
let timer = null;
let built = false;

function todayStamp(){
  const d = new Date();
  const mm = (d.getMonth()+1).toString().padStart(2,'0');
  const dd = d.getDate().toString().padStart(2,'0');
  const yy = d.getFullYear().toString().slice(-2);
  return `${mm} · ${dd} · ${yy}`;
}

function buildSlideshow(){
  if(built) return;
  built = true;

  if(IMAGE_FILES.length === 0){
    slidesEl.innerHTML = '';
    slideshow.innerHTML = '<p class="missing-note">no photos listed yet — add filenames to IMAGE_FILES in the code</p>';
    return;
  }

  slidesEl.innerHTML = IMAGE_FILES.map((src,i) =>
    `<div class="slide" data-i="${i}"><img src="${src}" alt="" onerror="this.closest('.slide').innerHTML='<p class=\\'missing-note\\'>couldn\\'t find '+this.src.split('/').pop()+'</p>'"></div>`
  ).join('');
  sprocketsEl.innerHTML = IMAGE_FILES.map((_,i) =>
    `<span class="sprocket" data-i="${i}"></span>`
  ).join('');

  stampEl.textContent = todayStamp();
  showSlide(0);
  restartTimer();
}

function showSlide(i){
  current = (i + IMAGE_FILES.length) % IMAGE_FILES.length;
  document.querySelectorAll('.slide').forEach(s => {
    s.classList.toggle('active', Number(s.dataset.i) === current);
    if(Number(s.dataset.i) === current){
      const img = s.querySelector('img');
      if(img){
        img.style.animation = 'none';
        void img.offsetWidth;
        img.style.animation = '';
      }
    }
  });
  document.querySelectorAll('.sprocket').forEach(s => {
    s.classList.toggle('active', Number(s.dataset.i) === current);
  });
}

function restartTimer(){
  clearInterval(timer);
  timer = setInterval(() => showSlide(current + 1), 5000);
}

nextBtn.addEventListener('click', () => { showSlide(current+1); restartTimer(); flashToast(); });
prevBtn.addEventListener('click', () => { showSlide(current-1); restartTimer(); flashToast(); });
slideshow.addEventListener('mouseenter', () => clearInterval(timer));
slideshow.addEventListener('mouseleave', () => restartTimer());

boxes[0].focus();
</script>

</body>
</html>
